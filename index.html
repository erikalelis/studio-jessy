<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jessy Studio</title>
<meta name="theme-color" content="#a8435c" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1417" media="(prefers-color-scheme: dark)">
<meta name="description" content="Turnos, clientes, servicios e ingresos de Jessy Studio.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jessy Studio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#faf6f5; --surface:#ffffff; --surface2:#f4ebe9; --ink:#2b2226; --muted:#7f7276; --line:#eadfdd;
  --accent:#a8435c; --accent-ink:#ffffff; --accent-soft:#f8e3e8; --accent2:#7a2d58;
  --ok:#336f4d; --ok-soft:#dff0e6; --warn:#8f5a14; --warn-soft:#fbecd3; --bad:#a8352c; --bad-soft:#fbe2de;
  --wa:#1f8f4e; --wa-ink:#ffffff;
  --rose-bg:linear-gradient(150deg,#fdeaf0 0%,#f7d6e1 100%); --rose-ink:#6b2740; --rose-line:rgba(107,39,64,.16); --rose-soft:rgba(168,67,92,.12);
  --hero-bg:linear-gradient(150deg,#d06a8b 0%,#a8456f 100%);
  --shadow:0 10px 28px rgba(70,30,45,.09);
  --cat1:#c0436a; --cat2:#7b5fc9; --cat3:#c78414; --cat4:#23897c;
  --display:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1a1417; --surface:#261d21; --surface2:#32272c; --ink:#f5ecef; --muted:#ab979d; --line:#3b2f34;
    --accent:#e88ba2; --accent-ink:#2a1119; --accent-soft:#41262f; --accent2:#c9719a;
    --ok:#7fcb9d; --ok-soft:#1d3327; --warn:#e6b45f; --warn-soft:#3a2d17; --bad:#f3978c; --bad-soft:#42221f;
    --wa:#4cc37f; --wa-ink:#0c2415;
    --rose-bg:linear-gradient(150deg,#4a2a38 0%,#3d2330 100%); --rose-ink:#ffe3ec; --rose-line:rgba(255,227,236,.18); --rose-soft:rgba(255,227,236,.12);
    --hero-bg:linear-gradient(150deg,#b24f73 0%,#8a3a64 100%);
    --shadow:0 10px 28px rgba(0,0,0,.35); --cat1:#f07f9b; --cat2:#b4a2f0; --cat3:#f0be5c; --cat4:#6fd0c3; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:var(--sat)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);padding:calc(8px + var(--sat)) 16px calc(150px + var(--sab));-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
#app{max-width:600px;margin-inline:auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--display);text-wrap:balance}
[hidden]{display:none!important}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sub{color:var(--muted);font-size:14px}
svg{flex:none}

.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-block:14px 18px}
.head h1{font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.01em;margin-top:4px}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}

.stack{display:flex;flex-direction:column;gap:22px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h h2{font-size:19px;font-weight:600}
.linkbtn{color:var(--accent);font-weight:600;font-size:14px;padding:6px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.list>*+*{border-top:1px solid var(--line)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:12px;align-items:center}

.hero{background:var(--hero-bg);color:#fff;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.hero .eyebrow{color:inherit;opacity:.8}
.hero .big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hero .time{font:700 44px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hero .in{font-weight:600;opacity:.9}
.hero h2{font-size:21px;font-weight:600}
.hero p{opacity:.85;font-size:14px}
.hero .btns{display:flex;gap:10px;flex-wrap:wrap}
.hero .btns>*{flex:1 1 140px}
.hero.empty{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.hero.empty .eyebrow{color:var(--muted);opacity:1}
.hero.empty p{color:var(--muted);opacity:1}

.mini{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini>div{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;min-width:0}
.mini b{display:block;font:700 26px/1.1 var(--display);margin-top:4px;font-variant-numeric:tabular-nums}
.mini small{color:var(--muted);font-size:13px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;font-weight:600;font-size:15px;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.soft{background:var(--surface2);color:var(--ink)}
.btn.wa{background:var(--wa);color:var(--wa-ink)}
.btn.light{background:rgba(255,255,255,.2);color:inherit}
.hero .btn.white{background:#fff;color:#7d2b40}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.ok{background:var(--ok-soft);color:var(--ok)}
.btn.dis{opacity:.5}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}

.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;min-height:64px;background:var(--surface)}
.row.off{opacity:.55}
.row.off b{text-decoration:line-through}
.row .t{font:600 15px var(--body);font-variant-numeric:tabular-nums;min-width:46px}
.who{display:flex;flex-direction:column;min-width:0;flex:1}
.who b{font-weight:600;overflow-wrap:anywhere}
.who small{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.avatar{width:42px;height:42px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 17px var(--display);flex:none}
.pill{display:inline-flex;align-items:center;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.pending{background:var(--warn-soft);color:var(--warn)}
.pill.confirmed{background:var(--accent-soft);color:var(--accent)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.cancelled{background:var(--surface2);color:var(--muted)}
.chev{color:var(--muted)}
.amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.in{color:var(--ok)}
.amt.out{color:var(--bad)}
.rowwa{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface)}
.rowwa .who{cursor:pointer}

.note{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--warn-soft);color:var(--warn);border-radius:16px;padding:12px 14px;font-size:14px}
.note .btn{min-height:38px;padding:0 14px;background:var(--surface);color:var(--ink);font-size:13px;flex:none}
.note.info{background:var(--accent-soft);color:var(--accent)}

.strip{position:relative;display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.day{flex:none;width:54px;padding:10px 0 8px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;scroll-snap-align:center}
.day small{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.day b{font:700 19px var(--display)}
.day i{width:5px;height:5px;border-radius:50%;background:transparent;margin-top:2px}
.day.has i{background:var(--accent)}
.day.today b{color:var(--accent)}
.day.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day.sel b,.day.sel small{color:inherit}
.day.sel small{opacity:.85}
.day.sel.has i{background:var(--accent-ink)}
.daytitle{display:flex;justify-content:space-between;align-items:center;gap:10px}
.daytitle h2{font-size:19px;font-weight:600}

.search{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 14px 0 42px;font-size:16px}
.searchwrap{position:relative;color:var(--muted)}
.searchwrap svg{position:absolute;left:13px;top:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lab{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px;min-width:0}
.field textarea{min-height:96px;resize:vertical;line-height:1.4}
.field input:focus,.field select:focus,.field textarea:focus,.search:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form{display:flex;flex-direction:column;gap:14px}
.ferr{color:var(--bad);font-size:14px;font-weight:500}
.ferr:empty{display:none}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{display:block}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:flex;align-items:center;justify-content:center;min-height:46px;border-radius:12px;background:var(--surface2);font-weight:600;color:var(--muted)}
.seg input:checked+span{background:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

.chips{display:flex;gap:8px;overflow-x:auto;margin-inline:-16px;padding:2px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:99px;background:var(--surface2);color:var(--ink);font-weight:600;font-size:14px;border:1px solid transparent;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin-inline:0;padding-inline:0}

.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(30,15,22,.5)}
.xwrap{position:sticky;top:-8px;height:0;margin-bottom:-16px;z-index:5;align-self:stretch;display:flex;justify-content:flex-end}.xclose{width:40px;height:40px;margin:-4px -4px 0 0;border:0;border-radius:50%;background:var(--surface);color:var(--ink,#6b4350);font-size:26px;line-height:1;cursor:pointer;box-shadow:0 1px 6px rgba(120,60,80,.18)}.panel .sh-head{padding-right:44px}.panel{position:relative;width:min(100%,600px);max-height:92%;overflow-y:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:18px 16px calc(22px + var(--sab));display:flex;flex-direction:column;gap:16px;animation:up .22s ease-out;overscroll-behavior:contain}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);align-self:center;margin-top:-6px;flex:none}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh-head h2{font-size:24px;font-weight:700;margin-top:2px;overflow-wrap:anywhere}
.actions{display:flex;flex-direction:column;gap:10px}
.actions2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.payopts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.confirmbox{background:var(--bad-soft);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;color:var(--bad);font-size:14px}
.hist{display:flex;flex-direction:column}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.hist div span:last-child{color:var(--muted);text-align:right}
.setcard{padding:16px;display:flex;flex-direction:column;gap:10px}
.setcard b{font-weight:600}
.hint{font-size:13px;color:var(--muted)}

.svc{padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%;background:var(--surface)}
.svc .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.svc h3{font-size:18px;font-weight:600}
.svc .price{font:700 18px var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.meter{height:6px;border-radius:6px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--cat,var(--accent));border-radius:6px}

.chart{width:100%;height:auto;display:block}
.chart text{font:500 10px var(--body);fill:var(--muted);text-anchor:middle}
.chart .bar{fill:var(--accent);opacity:.4}
.chart .bar.today{opacity:1}
.chart .base{stroke:var(--line);stroke-width:1}

.tabbar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,600px);z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(8px + var(--sab))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:12px;color:var(--muted);font-size:11px;font-weight:600;min-height:52px;justify-content:center}
.tab[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;z-index:21;right:max(16px,calc(50% - 284px));bottom:calc(84px + var(--sab));display:inline-flex;align-items:center;gap:8px;min-height:54px;padding:0 20px 0 16px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-weight:600;box-shadow:0 10px 24px rgba(168,67,92,.35)}
.toast{position:fixed;left:50%;bottom:calc(150px + var(--sab));transform:translate(-50%,12px);background:var(--accent2);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.panel{animation:none}.toast{transition:none}}

.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cat,var(--muted));margin-right:7px;vertical-align:middle}
.cat1{--cat:var(--cat1)}.cat2{--cat:var(--cat2)}.cat3{--cat:var(--cat3)}.cat4{--cat:var(--cat4)}
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.qa{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 2px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:11.5px;font-weight:600;min-width:0}
.qa.wa .ico{background:var(--wa);color:var(--wa-ink)}
.qa .ico{width:42px;height:42px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.income{background:var(--rose-bg);color:var(--rose-ink);border:1px solid var(--rose-line);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.income .eyebrow{color:inherit;opacity:.7}
.income .num{font:700 40px/1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:6px}
.income .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;opacity:.9}
.chg{padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;background:rgba(255,255,255,.7);color:var(--ok)}
.chg.neg{background:rgba(255,255,255,.7);color:var(--bad)}
.spark{display:flex;align-items:flex-end;gap:6px;height:68px}
.spark div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.spark i{display:block;width:100%;background:currentColor;opacity:.3;border-radius:6px}
.spark div:last-child i{opacity:1}
.spark span{font-size:10px;opacity:.65}
.income .btn{background:var(--rose-soft);color:inherit}
.income .two{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;border-top:1px solid var(--rose-line);padding-top:14px}
.income .two small{opacity:.7;font-size:12px}
.income .two b{display:block;font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.segb{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px;background:var(--surface2);border-radius:14px}
.segb button{min-height:40px;border-radius:11px;font-weight:600;color:var(--muted)}
.segb button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.brk{padding:12px 16px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.brk .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.preview{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:12px 14px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}


.pkgcard{padding:16px;display:flex;flex-direction:column;gap:10px}
.pkgcard .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pkgnum{font:700 22px var(--display);font-variant-numeric:tabular-nums;color:var(--accent)}
.pkgcard .hist{margin-top:2px}
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.pinin{width:190px;min-height:60px;text-align:center;font-size:30px;letter-spacing:.4em;padding-left:.4em;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.pinin:focus{outline:2px solid var(--accent);border-color:var(--accent)}

.bdaycard{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:20px;background:var(--accent-soft);border:1px solid var(--rose-line)}
.bdaycard .gift{width:46px;height:46px;border-radius:15px;background:var(--surface);color:var(--accent);display:grid;place-items:center;flex:none}

.segb.two{grid-template-columns:repeat(2,1fr)}
.iconbtn.sm{width:40px;height:40px;border-radius:12px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav h2{font-size:19px;font-weight:600;text-align:center;flex:1}
.tlwrap{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:0 10px 0 8px;overflow:hidden}
.tl{position:relative}
.tl-row{height:64px;display:flex;border-top:1px solid var(--line)}
.tl-row:first-child{border-top:0}
.tl-h{width:44px;flex:none;font-size:12px;color:var(--muted);padding-top:5px;font-variant-numeric:tabular-nums}
.tl-slots{flex:1;display:flex;flex-direction:column}
.tl-slots button{flex:1;display:block;width:100%;border-radius:8px}
.tl-slots button:first-child{border-bottom:1px dashed var(--line)}
.tl-slots button:active{background:var(--accent-soft)}
.tl-body{position:absolute;left:44px;right:0;top:0;bottom:0;pointer-events:none}
.ev{position:absolute;pointer-events:auto;border-radius:12px;padding:5px 8px;overflow:hidden;background:color-mix(in srgb,var(--cat,var(--accent)) 16%,var(--surface));border-left:4px solid var(--cat,var(--accent));text-align:left;font-size:13px;line-height:1.25;color:var(--ink)}
.ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.off{opacity:.5}.ev.off b{text-decoration:line-through}
.ev.done{opacity:.75}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--accent);z-index:2;pointer-events:none}
.nowline:before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mnav h2{font-size:19px;font-weight:600}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.mh{text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;padding:2px 0}
.mc{aspect-ratio:1/1.08;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:600;position:relative;font-variant-numeric:tabular-nums}
.mc.today{border-color:var(--accent);color:var(--accent)}
.mc.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mc .dots{display:flex;gap:3px;height:6px}
.mc .dots i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.mc.sel .dots i{background:var(--accent-ink)}
.mc .cake{position:absolute;top:2px;right:3px;font-size:10px;line-height:1}
.bdline{display:flex;align-items:center;gap:10px;background:var(--accent-soft);color:var(--accent);border-radius:14px;padding:8px 12px;font-weight:600;font-size:14px}
.bdline span{flex:1;min-width:0}
.rowwa input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
label.rowwa{cursor:pointer}
/* Pantallas grandes: la barra pasa a un costado y el contenido se centra */
@media (min-width:900px){
  body{padding-left:calc(16px + 220px);padding-bottom:40px}
  #app{max-width:720px}
  .tabbar{left:0;bottom:0;top:0;transform:none;width:220px;grid-template-columns:1fr;grid-auto-rows:56px;align-content:start;gap:4px;padding:calc(24px + var(--sat)) 12px 12px;border-top:0;border-right:1px solid var(--line)}
  .tab{flex-direction:row;justify-content:flex-start;gap:12px;padding:0 14px;font-size:15px}
  .tab[aria-current="page"]{background:var(--accent-soft)}
  .fab{right:32px;bottom:32px}
  .toast{bottom:32px}
  .sheet{align-items:center}
  .panel{border-radius:26px;max-height:88%}
}

 var bdy=function(off){var b=parse(D(off));return (b.getFullYear()-30)+"-"+pad(b.getMonth()+1)+"-"+pad(b.getDate())};
 clients[1].birthday=bdy(3);clients[2].birthday=bdy(0);clients[3].birthday=bdy(10);

 add(0,"10:00","c1","s1","confirmed");add(0,"11:30","c2","s2","pending");add(0,"15:00","c4","s5","confirmed");add(0,"17:30","c5","s4","pending");

 moves.push({id:uid(),date:D(-4),type:"out",concept:"Esmaltes y limas",method:"Transferencia",amount:18000});

/* ---------- WhatsApp ---------- */
function waNumber(phone){
 var raw=String(phone||"").trim(),d=raw.replace(/\D/g,"");
 if(!d)return "";
 if(raw.charAt(0)==="+"||d.indexOf("00")===0){d=d.replace(/^00/,"");if(d.indexOf("54")===0&&d.indexOf("549")!==0&&d.length===12)d="549"+d.slice(2);return d}
 if(d.indexOf("54")===0&&d.length>=12)return d.indexOf("549")===0?d:"549"+d.slice(2);
 if(d.charAt(0)==="0")d=d.slice(1);
 var m=d.match(/^(\d{2,4})15(\d{6,8})$/);
 if(m&&d.length===12)d=m[1]+m[2];
 return "549"+d;
}

}

function timelineHTML(date){

 evs.forEach(function(v){o=Math.min(o,Math.floor(v.s/60)*60);c=Math.max(c,Math.ceil(v.e/60)*60)});

 function flush(){var ends=[];cl.forEach(function(v){var i=0;while(i<ends.length&&ends[i]>v.s)i++;v.col=i;ends[i]=v.e});cl.forEach(function(v){v.n=ends.length});cl=[]}
 evs.forEach(function(v){if(v.s>=ce&&cl.length)flush();cl.push(v);ce=cl.length===1?v.e:Math.max(ce,v.e)});

 for(var i=0;i<hrs;i++){var h=st/60+i;rows+='<div class="tl-row"><span class="tl-h">'+pad(h)+':00</span><div class="tl-slots"><button data-act="slot-new" data-t="'+pad(h)+':00" aria-label="Agendar a las '+pad(h)+':00"></button><button data-act="slot-new" data-t="'+pad(h)+':30" aria-label="Agendar a las '+pad(h)+':30"></button></div></div>'}
 var ev=evs.map(function(v){
  var a=v.a,top=(v.s-st)/60*H+1,ht=Math.max(30,(v.e-v.s)/60*H-3),w=100/v.n,l=v.col*w;
  return '<button class="ev '+cat(a.service)+(a.status==="cancelled"?" off":"")+(a.status==="done"?" done":"")+'" data-act="appt" data-id="'+a.id+'" style="top:'+top+'px;height:'+ht+'px;left:calc('+l+'% + 2px);width:calc('+w+'% - 4px)"><b>'+a.time+' · '+esc(nm(a))+(a.status==="done"?" ✓":"")+'</b><small>'+esc(a.service)+(a.status==="pending"?" · sin confirmar":"")+'</small></button>';
 }).join("");
 var nl="",n=nowM();
 if(date===T&&n>=st&&n<=st+hrs*60)nl='<div class="nowline" style="top:'+((n-st)/60*H)+'px"></div>';

}

    b.checked=on});updPromo();break;

   else toast("Compartir la imagen funciona desde el celular con la app instalada");
   break;

   startBulk(x.map(function(q){var c=clientById(q.cid);return {cid:q.cid,aid:q.id,name:nm(q),text:msgFor("recordatorio",c,q)}}));break;
  case "bulk-skip":if(bulk){bulk.i++;sheetBulkStep()}break;
  case "bulk-stop":bulk=null;closeSheet();break;
  case "amode":aMode=d.m;calM=selDate.slice(0,7);render();break;
  case "day-step":selDate=addDays(selDate,Number(d.n));render();break;
  case "cal-step":x=parse(calM+"-01");calM=iso(new Date(x.getFullYear(),x.getMonth()+Number(d.n),1)).slice(0,7);render();break;
  case "cal-day":selDate=d.d;render();break;

  case "bday-ics-all":downloadBdays(S.clients.filter(function(c){return c.birthday}),"cumpleanos-studio-jessy");break;
  case "bday-close":closeSheet();break;
  case "wa-copy":x=$("#wa-text");if(x){var done=function(){toast("Mensaje copiado. Pegalo en el chat")};
   try{navigator.clipboard.writeText(x.value).then(done,function(){x.select();try{document.execCommand("copy");done()}catch(e){toast("Mantené apretado el texto para copiarlo")}})}
   catch(e){x.select();try{document.execCommand("copy");done()}catch(e2){toast("Mantené apretado el texto para copiarlo")}}}break;
  case "go-clientas":tab="clientas";render();window.scrollTo(0,0);break;
  case "lock-forgot":$("#l-help").hidden=false;$("#l-imp").hidden=false;break;
  case "sell-pkg":sheetSell(d.cid||"");break;
  case "save-sell":saveSell();break;
  case "new-pkg":sheetPkg(null);break;
  case "pkg":sheetPkg(d.id);break;
  case "save-pkg":savePkg(d.id||null);break;
  case "del-pkg":S.packages=S.packages.filter(function(q){return q.id!==d.id});closeSheet();render();toast("Paquete eliminado");break;
  case "use-pkg":
   x=apptById(d.id);var pm=memOpen(x.cid),n=Number(d.n)||1;
   if(!pm||memLeft(pm)<n){toast("No alcanzan los usos del paquete");break}
   x.status="done";removeMove(x.id);x.pkg=pm.id;pm.usage.push({id:uid(),date:T0(),apptId:x.id,n:n});
   closeSheet();render();toast("Descontado. Quedan "+memLeft(pm)+" de "+pm.total);break;
  case "mem-use":x=memById(d.id);if(x&&memLeft(x)>0){x.usage.push({id:uid(),date:T0(),apptId:"",n:1});render();sheetClient(x.cid);toast("Uso anotado. Quedan "+memLeft(x))}break;
  case "mem-undo":x=memById(d.id);if(x&&x.usage.length){var lu=x.usage.pop();if(lu.apptId){var la=apptById(lu.apptId);if(la&&la.pkg){la.status="confirmed";delete la.pkg}}render();sheetClient(x.cid);toast("Último uso deshecho")}break;
  case "del-mem":x=memById(d.id);if(x){S.appts.forEach(function(q){if(q.pkg===x.id){q.status="confirmed";delete q.pkg}});S.memberships=S.memberships.filter(function(q){return q.id!==x.id});var cc=x.cid;render();sheetClient(cc);toast("Paquete eliminado")}break;
  case "home":tab="hoy";closeSheet();render();window.scrollTo(0,0);break;

  case "go-agenda":tab="agenda";aMode="dia";selDate=T0();render();window.scrollTo(0,0);break;

   x.price=am;x.cur=pc;x.status="done";removeMove(x.id);var pm2={id:uid(),date:T0(),type:"in",concept:x.service+" · "+nm(x),method:d.m,amount:am,apptId:x.id,svc:x.service,svcs:(x.names&&x.names.length?x.names:x.service.split(" + "))};if(pc==="BRL")pm2.cur="BRL";S.moves.push(pm2);closeSheet();render();toast("Cobro registrado en ingresos");break;
  case "unpay":x=apptById(d.id);x.status="confirmed";removeMove(x.id);if(x.pkg){var um=memById(x.pkg);if(um)um.usage=um.usage.filter(function(u){return u.apptId!==x.id});delete x.pkg}closeSheet();render();toast("Cobro deshecho");break;
  case "cancel-appt":x=apptById(d.id);x.status="cancelled";closeSheet();render();toast("Turno cancelado");break;
  case "reopen":x=apptById(d.id);x.status="pending";closeSheet();render();toast("Turno vuelto a agendar");break;
  case "client":sheetClient(d.id);break;
  case "new-client":sheetClient(null);break;
  case "save-client":saveClient(d.id||null);break;
  case "del-client":S.appts=S.appts.filter(function(a2){return !(a2.cid===d.id&&(a2.status==="pending"||a2.status==="confirmed"))});S.clients=S.clients.filter(function(c){return c.id!==d.id});S.memberships=S.memberships.filter(function(m){return m.cid!==d.id});closeSheet();render();toast("Cliente eliminado");break;

  case "new-move":sheetMove(null);break;
  case "save-move":saveMove();break;
  case "del-move":x=S.moves.filter(function(m){return m.id===d.id})[0];if(x&&x.apptId){var ap=apptById(x.apptId);if(ap&&ap.status==="done")ap.status="confirmed"}S.moves=S.moves.filter(function(m){return m.id!==d.id});closeSheet();render();toast("Movimiento eliminado");break;
  case "wa-compose":sheetWA(d.cid||"",d.aid||"",d.k);break;

   var wc=$("#wasvc");if(wc)wc.innerHTML=waSvcChips();$("#wa-text").value=msgFor(wa.kind,clientById(wa.cid),apptById(wa.aid));updWA()}break;

document.addEventListener("click",function(e){
 var w=e.target.closest("a[data-wa]");
 if(w){

 }

 }
 if(id==="f-date"||id==="f-time"){ack=false;refreshSlots()}

});

if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){
 var hadCtrl=!!navigator.serviceWorker.controller;
 window.addEventListener("load",function(){
  try{
   navigator.serviceWorker.register("sw.js").then(function(reg){
